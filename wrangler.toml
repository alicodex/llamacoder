name = "llamacoder"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".open-next/output"

# Environment variables are set via the Cloudflare Pages dashboard
# or using: wrangler secret put <KEY>
#
# Required secrets:
#   TOGETHER_API_KEY
#   DATABASE_URL          (Supabase pooled connection string)
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
#   SITE_URL              (your *.pages.dev URL)
#
# Admin dashboard:
#   ADMIN_PASSWORD
#   ADMIN_SESSION_SECRET
#
# Optional:
#   HELICONE_API_KEY
#   CSB_API_KEY
